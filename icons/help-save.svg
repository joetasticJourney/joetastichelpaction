ke:rgb(0, 114, 178);color:rgb(11, 11, 11);stroke-width:32px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><use href="#rhs-hand" fill="#1A1614" stroke="#1A1614" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" style="fill:rgb(26, 22, 20);stroke:rgb(26, 22, 20);color:rgb(11, 11, 11);stroke-width:12px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><use href="#rhs-hand" fill="#FFF3E2" style="fill:rgb(255, 243, 226);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><use href="#rhs-thumb" fill="#1A1614" stroke="#1A1614" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" style="fill:rgb(26, 22, 20);stroke:rgb(26, 22, 20);color:rgb(11, 11, 11);stroke-width:12px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><use href="#rhs-thumb" fill="#FFF3E2" style="fill:rgb(255, 243, 226);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/></g></svg>