name: Release

# Fires when you push a tag like v1.2.0. Zips the module contents (excluding
# git/CI files) and creates a GitHub Release with module.json + module.zip
# attached under the `latest` alias, matching the manifest/download URLs in
# module.json.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read module version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify module.json version matches tag
        run: |
          jq -e --arg v "${{ steps.version.outputs.value }}" '.version == $v' module.json \
            || (echo "module.json version does not match tag ${{ github.ref_name }}" && exit 1)

      - name: Build module.zip
        run: |
          zip -r module.zip . \
            -x ".git/*" ".github/*" ".gitignore" "module.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            module.json
            module.zip
          fail_on_unmatched_files: true
